<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lid Awake for Mac</title>
  <meta name="description" content="Keep your Mac awake, even with the lid closed. A free, open-source menu bar app for macOS.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://kzahel.github.io/lid-awake/">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <img class="app-icon" src="icon.png" width="112" height="112" alt="">
    <h1>Lid Awake</h1>
    <p class="description">Keep your Mac awake.<br>Even with the lid closed.</p>
    <a class="button" href="{{DOWNLOAD_URL}}">Download for Mac <span aria-hidden="true">↓</span></a>
    <p class="release">macOS {{MINIMUM_MACOS}}+ <span aria-hidden="true">·</span> <a href="{{RELEASE_URL}}">{{RELEASE_KIND}} {{VERSION}}</a></p>
  </main>
  <footer>
    <a href="https://github.com/kzahel/lid-awake/blob/main/docs/USER-GUIDE.md">Guide</a>
    <a href="https://github.com/kzahel/lid-awake">Free &amp; open source</a>
    <a href="https://graehlarts.com">Graehl Arts</a>
  </footer>
</body>
</html>
