name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build app
        run: |
          xcodebuild -quiet -project LidAwake.xcodeproj -scheme LidAwake \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test session safety logic
        run: |
          xcodebuild -quiet -project LidAwake.xcodeproj -scheme LidAwake \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate changelog and prepare release notes
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Select Xcode
        run: xcodebuild -version
      - name: Validate release credentials
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for value in "$CERT" "$CERT_PASSWORD" "$KEYCHAIN_PASSWORD" "$ASC_KEY" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$SPARKLE_KEY"; do
            test -n "$value" || { echo 'A release credential is missing.' >&2; exit 1; }
          done
      - name: Import signing certificate
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" | grep 'Developer ID Application'
      - name: Prepare notarization and updater keys
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle-ed25519.key"
      - name: Build signed release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( minor < 1000 && patch < 1000 ))
          build_number=$((major * 1000000 + minor * 1000 + patch))
          xcodebuild -quiet -project LidAwake.xcodeproj -scheme LidAwake archive \
            -archivePath build/LidAwake.xcarchive -configuration Release -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' ARCHS='arm64 x86_64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Developer ID Application: Kyle Graehl (VD7BYQ6ABM)' \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build_number"
          xcodebuild -quiet -exportArchive -archivePath build/LidAwake.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist
      - name: Install DMG builder
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/python" -m pip install 'dmgbuild==1.6.7'
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"
      - name: Package, notarize, and sign update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ASC_API_KEY_FILE: ${{ runner.temp }}/asc-key.p8
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle-ed25519.key
        run: bash scripts/package-release.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dir="build/release/$tag"
          release_flags=(--draft)
          if [[ "$tag" == v0.0.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$tag" "$dir/LidAwake-$tag.dmg" \
            "$dir/appcast-input/LidAwake-$tag.zip" "${release_flags[@]}" --title "Lid Awake $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish release and appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release edit "$tag" --draft=false
          git fetch origin main
          git checkout main
          cp "build/release/$tag/appcast.xml" appcast.xml
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git -c user.name='lid-awake-release' -c user.email='actions@users.noreply.github.com' \
              commit -m "Publish $tag update feed"
            git push origin main
          fi
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lid-awake-${{ github.ref_name }}
          path: |
            build/release/${{ github.ref_name }}/LidAwake-${{ github.ref_name }}.dmg
            build/release/${{ github.ref_name }}/appcast-input/LidAwake-${{ github.ref_name }}.zip
            build/release/${{ github.ref_name }}/appcast.xml
